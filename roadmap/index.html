<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flap Wars Roadmap · Heider Games</title>
<meta name="description" content="Flap Wars roadmap: what we built and what comes next. / Hoja de ruta de Flap Wars.">
<meta property="og:title" content="Flap Wars Roadmap">
<meta property="og:description" content="What we built and what comes next for Flap Wars, a one-tap arcade game for Android.">
<meta property="og:image" content="https://heidergames.github.io/portada.jpg">
<link rel="icon" href="../icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Un solo mundo visual: el cielo nocturno de la pantalla de arranque del juego.
     La ruta es un vuelo: cada etapa es un tramo entre columnas. */
  --night:#0E183C;
  --night-2:#16224F;
  --card:#1B2A5E;
  --line:#2E4180;
  --sky:#38C0FF;
  --gold:#FDC200;
  --ink:#F4F7FF;
  --muted:#A9B6DD;
  --done:#3DDC97;
  --next:#38C0FF;
  --later:#B79CFF;
  --vision:#FDC200;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--night);
  background-image:
    radial-gradient(1200px 600px at 50% -10%, #23367a 0%, transparent 70%),
    radial-gradient(2px 2px at 12% 18%, #fff8 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 78% 9%, #fff7 50%, transparent 51%),
    radial-gradient(2px 2px at 64% 31%, #fff5 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 30% 44%, #fff6 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 90% 52%, #fff5 50%, transparent 51%);
  color:var(--ink);
  font-family:var(--body);
  font-size:17px;
  line-height:1.55;
}
img{max-width:100%;display:block}
a{color:var(--sky)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* barra superior */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0}
.top img{height:30px;width:auto}
.lang{display:flex;background:var(--night-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{font:800 13px var(--body);letter-spacing:.06em;color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--sky);color:var(--night)}
.lang button:focus-visible,.chip:focus-visible,.cta:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* portada */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding:18px 0 34px}
.hero .logo{width:min(420px,100%);filter:drop-shadow(0 12px 24px #0008)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,6vw,64px);line-height:1;margin:16px 0 10px;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--gold)}
.lede{color:var(--muted);max-width:52ch;margin:0 0 20px;font-weight:600}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:var(--night);text-decoration:none;font:400 21px var(--display);letter-spacing:.02em;padding:13px 22px;border-radius:16px;box-shadow:0 6px 0 #b68a00,0 14px 30px #0006;transition:transform .12s}
.cta:hover{transform:translateY(-2px)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #b68a00}
.cta img{width:30px;height:30px;border-radius:8px}

/* tarjeta del jugador / progreso */
.run{background:linear-gradient(180deg,var(--night-2),var(--card));border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 40px #0005}
.run h2{font:400 15px var(--body);font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 6px}
.score{font-family:var(--display);font-size:56px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--muted)}
.track{position:relative;height:16px;border-radius:999px;background:#0b1430;border:1px solid var(--line);margin:22px 0 12px}
.track i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--done),var(--sky))}
.track img{position:absolute;top:50%;width:44px;height:44px;border-radius:12px;transform:translate(-50%,-50%) rotate(-8deg);border:2px solid #fff;box-shadow:0 6px 14px #0007}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.fact{background:#0b1430;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fact b{display:block;font:400 26px var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.fact span{font-size:14px;color:var(--muted);font-weight:700}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 24px}
.filters p{margin:0 6px 0 0;font-weight:800;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.1em}
.chip{display:inline-flex;align-items:center;gap:8px;font:800 14px var(--body);color:var(--ink);background:var(--night-2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--night);border-color:var(--ink)}

/* ruta de vuelo */
.route{position:relative;display:grid;gap:22px;padding-bottom:40px}
.route::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);
  background:repeating-linear-gradient(180deg,var(--line) 0 14px,transparent 14px 26px);border-radius:4px}
.stage{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.stage .card{grid-column:1}
.stage .art{grid-column:2}
.stage:nth-child(even) .card{grid-column:2;grid-row:1}
.stage:nth-child(even) .art{grid-column:1;grid-row:1}
.stage::after{content:attr(data-n);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:400 20px var(--display);
  background:var(--s);color:var(--night);border:3px solid var(--night);box-shadow:0 0 0 3px var(--s),0 8px 18px #0008}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:0 14px 30px #0004;border-top:5px solid var(--s)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.pill{font:800 12px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--night);background:var(--s);border-radius:999px;padding:3px 10px}
.when{font-weight:800;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.card h3{font:400 26px/1.1 var(--display);margin:4px 0 8px;letter-spacing:.01em;text-wrap:balance}
.card ul{margin:0;padding-left:20px}
.card li{margin:3px 0}
.card li::marker{color:var(--s)}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.who figure{margin:0;text-align:center;width:64px}
.who img{width:64px;height:64px;border-radius:16px;border:2px solid var(--line)}
.who figcaption{font-size:12px;font-weight:800;color:var(--muted);margin-top:3px}
.art{border-radius:20px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;background:var(--night-2);box-shadow:0 14px 30px #0005;position:relative}
.art img{width:100%;height:100%;object-fit:cover}
.art.logo-only{display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2a3f86,var(--night-2))}
.art.logo-only img{width:auto;height:auto;max-width:70%;max-height:80%;object-fit:contain}
.art .tag{position:absolute;left:12px;bottom:12px;font:400 18px var(--display);background:#0E183Ccc;padding:4px 12px;border-radius:10px}
.stage.done{--s:var(--done)}
.stage.next{--s:var(--next)}
.stage.later{--s:var(--later)}
.stage.vision{--s:var(--vision)}
.stage.hidden{display:none}

footer{border-top:1px solid var(--line);padding:26px 0 40px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center;color:var(--muted);font-size:15px}
footer img{height:28px;width:auto}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .route::before{left:22px}
  .stage{grid-template-columns:1fr;gap:12px;padding-left:56px}
  .stage .card,.stage .art,.stage:nth-child(even) .card,.stage:nth-child(even) .art{grid-column:1;grid-row:auto}
  .stage .art{order:-1}
  .stage::after{left:22px;top:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="img/heider.png" alt="Heider Games">
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" id="lang-es" aria-pressed="true">ES</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
    </div>
  </div>

  <section class="hero">
    <div>
      <img class="logo" src="img/logo.png" alt="Flap Wars">
      <h1 id="t-title"></h1>
      <p class="lede" id="t-lede"></p>
      <a class="cta" id="t-cta" href="https://play.google.com/store/apps/details?id=com.heidergames.flapwars"><img src="img/icono.jpg" alt=""><span></span></a>
    </div>
    <aside class="run" aria-labelledby="t-run">
      <h2 id="t-run"></h2>
      <div class="score"><span id="done-n">0</span><small> / <span id="all-n">0</span></small></div>
      <div class="track" aria-hidden="true"><i id="bar"></i><img id="bird" src="img/pulse.jpg" alt=""></div>
      <div class="facts" id="facts"></div>
    </aside>
  </section>

  <div class="filters" role="group" aria-labelledby="t-filter">
    <p id="t-filter"></p>
    <button type="button" class="chip" data-f="all" aria-pressed="true"></button>
    <button type="button" class="chip" data-f="done" style="--c:var(--done)" aria-pressed="false"></button>
    <button type="button" class="chip" data-f="next" style="--c:var(--next)" aria-pressed="false"></button>
    <button type="button" class="chip" data-f="later" style="--c:var(--later)" aria-pressed="false"></button>
    <button type="button" class="chip" data-f="vision" style="--c:var(--vision)" aria-pressed="false"></button>
  </div>

  <main class="route" id="route"></main>

  <footer>
    <span id="t-foot"></span>
    <img src="img/heider.png" alt="Heider Games">
  </footer>
</div>

<script>
const UI={
 es:{title:'Hoja de <span>ruta</span>',lede:'Flap Wars es el primer juego de Heider Games: un arcade de un toque, rápido y lleno de color. Ya está disponible en todo el mundo. Esto es lo que hicimos y lo que viene.',
  cta:'Juega gratis en Google Play',run:'Etapas completadas',filter:'Ver',
  chips:{all:'Todo',done:'Hecho',next:'Próximo',later:'Más adelante',vision:'La visión'},
  facts:[['13 nov','Lanzamiento mundial'],['5','Personajes'],['2','Mundos'],['2','Idiomas']],
  foot:'Hoja de ruta viva: el orden y las fechas pueden cambiar. Contacto: heidergames.contacto@gmail.com'},
 en:{title:'Road<span>map</span>',lede:'Flap Wars is the first game by Heider Games: a fast, colorful one-tap arcade game. It is out now worldwide. Here is what we built and what comes next.',
  cta:'Play free on Google Play',run:'Stages cleared',filter:'Show',
  chips:{all:'All',done:'Done',next:'Next',later:'Later',vision:'The vision'},
  facts:[['Nov 13','Worldwide launch'],['5','Characters'],['2','Worlds'],['2','Languages']],
  foot:'A living roadmap: order and dates may change. Contact: heidergames.contacto@gmail.com'}
};
const S=[
 {s:'done',art:'img/valle.jpg',tag:{es:'Valle Verde',en:'Green Valley'},
  when:{es:'Octubre 2026',en:'October 2026'},
  t:{es:'Del sueño al primer prototipo',en:'From a dream to the first prototype'},
  li:{es:['Primeras versiones jugables y el vuelo de un toque','El mundo Valle Verde','Los cuatro primeros personajes'],
      en:['First playable builds and one-tap flight','The Green Valley world','The first four characters']},
  who:['pulse','kiko','nova','blaze']},
 {s:'done',art:'img/icono.jpg',logo:true,
  when:{es:'26 oct 2026',en:'Oct 26, 2026'},
  t:{es:'Prueba cerrada',en:'Closed test'},
  li:{es:['14 testers probando cada versión en sus teléfonos','Ajustes de dificultad, sonido y pantallas con sus comentarios'],
      en:['14 testers trying every build on their phones','Difficulty, sound and screens tuned from their feedback']}},
 {s:'done',art:'img/desierto.jpg',tag:{es:'Desierto Solar',en:'Sun Desert'},
  when:{es:'13 nov 2026 · v1.3',en:'Nov 13, 2026 · v1.3'},
  t:{es:'Lanzamiento mundial',en:'Worldwide launch'},
  li:{es:['Nuevo mundo: Desierto Solar, con Aegis','Misiones diarias y cofre diario','Reto del día: el mismo nivel para todo el mundo','Premios por días seguidos','En español y en inglés'],
      en:['New world: Sun Desert, with Aegis','Daily missions and a daily chest','Daily Challenge: the same level for everyone','Daily streak rewards','In Spanish and English']},
  who:['aegis']},
 {s:'done',art:'img/powerups.jpg',tag:{es:'v1.4',en:'v1.4'},
  when:{es:'16 nov 2026 · v1.4',en:'Nov 16, 2026 · v1.4'},
  t:{es:'Power-ups y Reta a un amigo',en:'Power-ups and Challenge a Friend'},
  li:{es:['Power-ups en plena partida: escudo, imán, cámara lenta y mini','Potenciadores para empezar con ventaja','Reta a un amigo: el mismo recorrido para los dos','Tienda con pack de inicio y packs de monedas','Pantalla de inicio reordenada'],
      en:['In-run power-ups: shield, magnet, slow motion and mini','Boosters to start with an edge','Challenge a Friend: the same course for both of you','Shop with a starter pack and coin packs','A reorganized home screen']}},
 {s:'next',art:'img/logo_navidad.png',logo:true,
  when:{es:'1 dic 2026 – 6 ene 2027',en:'Dec 1, 2026 – Jan 6, 2027'},
  t:{es:'Evento de Navidad',en:'Christmas event'},
  li:{es:['Valle Verde cubierto de nieve','Regalos que desbloquean gorros de Navidad','Calendario de adviento con premios','Música navideña'],
      en:['A snow-covered Green Valley','Gifts that unlock Santa hats','An advent calendar with rewards','Christmas music']}},
 {s:'later',art:'img/icono.jpg',logo:true,
  when:{es:'v1.5',en:'v1.5'},
  t:{es:'Una casa nueva',en:'A brand-new home screen'},
  li:{es:['Pantalla de inicio renovada: Perfil, Rankings, Misiones y Eventos','Mejor selector de mundos y de personajes','Pantalla de carga distinta para cada mundo'],
      en:['Redesigned home: Profile, Rankings, Missions and Events','Better world and character selection','A loading screen for each world']}},
 {s:'later',art:'img/neon.jpg',tag:{es:'Ciudad Neón',en:'Neon City'},
  when:{es:'2027',en:'2027'},
  t:{es:'Nuevos mundos y personajes',en:'New worlds and characters'},
  li:{es:['Ciudad Neón y Reino Helado, cada uno con su personaje','Cada mundo se juega distinto, no es solo otro color','Y una sorpresa que solo se gana jugando…'],
      en:['Neon City and Frozen Kingdom, each with its own character','Every world plays differently, not just a new color','And a surprise you can only earn by playing…']},
  who:['shadow','bite','sprig','cinder']},
 {s:'vision',art:'img/hielo.jpg',tag:{es:'Reino Helado',en:'Frozen Kingdom'},
  when:{es:'Más adelante',en:'Further ahead'},
  t:{es:'Rankings, temporadas y skins',en:'Rankings, seasons and skins'},
  li:{es:['Rankings mundiales y temporadas con eventos','Skins y accesorios para cada personaje','Idea: quien lidere el ranking propone un personaje o un mundo nuevo'],
      en:['Global rankings and seasonal events','Skins and accessories for every character','Idea: the ranking leader gets to propose a new character or world']}},
 {s:'vision',art:'img/logo.png',logo:true,
  when:{es:'La meta',en:'The goal'},
  t:{es:'Wars: 1 contra 1 en vivo',en:'Wars: live 1-versus-1'},
  li:{es:['Duelos en tiempo real contra otro jugador','El “Wars” que le da nombre al juego'],
      en:['Real-time duels against another player','The “Wars” the game is named after']}}
];
let lang='es', filter='all';
try{ const l=localStorage.getItem('fw-roadmap-lang'); if(l==='en'||l==='es') lang=l; }catch(e){}
const q=new URLSearchParams(location.search).get('lang'); if(q==='en'||q==='es') lang=q;
const $=id=>document.getElementById(id);
function render(){
  const u=UI[lang]; document.documentElement.lang=lang;
  $('t-title').innerHTML=u.title; $('t-lede').textContent=u.lede; $('t-cta').querySelector('span').textContent=u.cta;
  $('t-run').textContent=u.run; $('t-filter').textContent=u.filter; $('t-foot').textContent=u.foot;
  document.querySelectorAll('.chip').forEach(c=>{c.textContent=u.chips[c.dataset.f]; c.setAttribute('aria-pressed',c.dataset.f===filter)});
  $('lang-es').setAttribute('aria-pressed',lang==='es'); $('lang-en').setAttribute('aria-pressed',lang==='en');
  $('facts').innerHTML=u.facts.map(f=>`<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join('');
  const done=S.filter(x=>x.s==='done').length; $('done-n').textContent=done; $('all-n').textContent=S.length;
  const pct=(done/S.length)*100; $('bar').style.width=pct+'%'; $('bird').style.left=pct+'%';
  $('route').innerHTML=S.map((x,i)=>{
    const art=x.logo?`<div class="art logo-only"><img src="${x.art}" alt=""></div>`:`<div class="art"><img src="${x.art}" alt=""><span class="tag">${x.tag[lang]}</span></div>`;
    const who=x.who?`<div class="who">${x.who.map(n=>`<figure><img src="img/${n}.jpg" alt="${n}"><figcaption>${n[0].toUpperCase()+n.slice(1)}</figcaption></figure>`).join('')}</div>`:'';
    const hide=filter!=='all'&&filter!==x.s?' hidden':'';
    return `<section class="stage ${x.s}${hide}" data-n="${i+1}"><article class="card"><div class="meta"><span class="pill">${u.chips[x.s]}</span><span class="when">${x.when[lang]}</span></div><h3>${x.t[lang]}</h3><ul>${x.li[lang].map(l=>`<li>${l}</li>`).join('')}</ul>${who}</article>${art}</section>`;
  }).join('');
}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{filter=c.dataset.f;render()}));
['es','en'].forEach(l=>$('lang-'+l).addEventListener('click',()=>{lang=l;try{localStorage.setItem('fw-roadmap-lang',l)}catch(e){};render()}));
render();
</script>
</body>
</html>
